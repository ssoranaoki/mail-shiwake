<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>メール仕分け</title>
<style>/*STYLE*/</style>
</head>
<body>
<header class="bar">
  <div class="title">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
    メール仕分け
  </div>
  <div class="actions">
    <button type="button" id="learn" class="primary">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l4 4 10-10"/></svg>お手本を覚える
    </button>
    <span class="offline"><span class="dot"></span>オフラインで動作中</span>
  </div>
</header>
<div class="main">
  <nav class="folders" aria-label="振り分け先のフォルダ">
    <p class="side-title">振り分け先（お手本の数）</p>
    <ul id="folders"></ul>
  </nav>
  <section class="list" aria-label="届いたメール">
    <p class="list-title" id="list-title">届いたメール</p>
    <div id="status" class="status" role="status">読み込み中…（はじめはモデルの読み込みに数秒かかります）</div>
    <ul id="mails" class="mails"></ul>
  </section>
</div>
<script>/*SCRIPT*/</script>
</body>
</html>

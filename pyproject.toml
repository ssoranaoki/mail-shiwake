[project]
name = "mail-shiwake"
version = "0.1.0"
description = "お手本を数通見せるだけで、メールを話題ごとに振り分ける。メールはパソコンの外に出さない（EmbeddingGemma 2）"
requires-python = ">=3.12"
dependencies = [
    "onnxruntime>=1.31",
    "tokenizers>=0.23",
    "numpy>=2.5",
    "huggingface-hub>=2.4",
    "pywebview>=6.2",  # 画面の窓（中身は HTML/CSS/JS。Windows は WebView2、Mac は WebKit）
    # Outlook とつなぐ部分だけが使う（Windows のクラシック版 Outlook 専用）
    "pywin32>=312; sys_platform == 'win32'",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mail_shiwake = ["ui/*"]
